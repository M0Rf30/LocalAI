---
name: "sherpa-onnx"
description: "Speech recognition with Next-gen Kaldi and ONNX Runtime"
license: "Apache 2.0"
urls:
  - "https://github.com/k2-fsa/sherpa-onnx"
icon: "https://avatars.githubusercontent.com/u/71431748?s=200&v=4"

config_file: |
  backend: sherpa-onnx
  name: sherpa-onnx
  parameters:
    # Number of threads to use for inference
    threads: 4
    # Provider for ONNX Runtime (cpu, cuda, etc.)
    library_search_path: "cpu"
    # Decoding method (greedy_search, modified_beam_search)
    language: "greedy_search"
